NodeName=john-thinker NodeAddr=<Thinker_IP> CPUs=8 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=2 RealMemory=14500

PartitionName=main Nodes=ALL Default=YES MaxTime=INFINITE State=UP

ReturnToService=2